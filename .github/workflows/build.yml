name: Build and Version with GitVersion

on:
  push:
    branches:
      - master
      - main
      - development/**
      - feature/**
      - release/**
      - hotfix/**
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for GitVersion to work properly

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.4.x'
          preferLatestVersion: true

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Display GitVersion outputs
        run: |
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with GitVersion
        run: dotnet build --configuration Release /p:Version=${{ steps.gitversion.outputs.fullSemVer }}

      # Optional: publish artifacts
      # - name: Publish
      #   run: dotnet publish --configuration Release --output ./publish /p:Version=${{ steps.gitversion.outputs.fullSemVer }}
      # - name: Upload artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app
      #     path: ./publish
  build-linux:
    runs-on: ubuntu-22.04  # older glibc; the native tools below are linked statically anyway
    env:
      # Fork of marsinator358/luajit-decompiler-v2 with Linux support (CMake build)
      DECOMPILER_REPO: DefKorns/luajit-decompiler-v2
      DECOMPILER_REF: linux-support

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install build tools (Native AOT needs clang and zlib)
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev cmake

      - name: Build LuaJIT 2.0 (static)
        run: bash scripts/build-luajit-linux.sh

      - name: Checkout decompiler
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DECOMPILER_REPO }}
          ref: ${{ env.DECOMPILER_REF }}
          path: _decompiler

      - name: Build decompiler (static)
        run: |
          cmake -S _decompiler -B _decompiler/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build _decompiler/build -j"$(nproc)"
          mkdir -p Lib/decompiler-linux
          cp _decompiler/build/luajit-decompiler-v2 Lib/decompiler-linux/
          cp _decompiler/LICENSE Lib/decompiler-linux/LICENSE

      - name: Publish (linux-x64)
        run: dotnet publish --configuration Release -r linux-x64 -p:TargetOs=linux --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snes-mini-lua-compiler-linux-x64
          path: ./publish
